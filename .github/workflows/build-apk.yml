name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F '.' '{print $2}')
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be found or created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$RUNNER_TMP_DIR"
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          CLEAN_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${RUNNER_TMP_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}
          - **Build Type**: Automatically generated debug APK
          - **Build System**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Source Commit SHA**: ${{ github.sha }}
          - **Intended Use**: Testing only
          EOF
          )
          gh release create "$RELEASE_TAG" \
            "${{ steps.prepare_asset.outputs.asset_path }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build and publish completed. Artifact app-debug-apk is preserved."
