name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            base64 -d ./debug.keystore.base64 > ./debug.keystore
            echo "Successfully restored debug.keystore from base64"
          elif [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "Generated fallback debug.keystore"
          fi
          ls -la ./debug.keystore

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SAIF-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
